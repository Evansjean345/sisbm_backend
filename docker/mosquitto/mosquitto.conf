# =============================================================================
#  SISBM CORE — broker MQTT (Eclipse Mosquitto 2.x)
#
#  Image : eclipse-mosquitto:2.1-alpine  (image officielle Docker)
#  Protocole : MQTT 5 (nécessaire pour le TTL par message)
#
#  Validé en exécution : authentification, ACL et expiration des messages.
# =============================================================================

# --------------------------------------------------------------- écouteur
# 1883 en clair : JAMAIS exposé hors du réseau Docker.
# Pour l'exposition externe, utiliser l'écouteur TLS 8883 (voir plus bas).
listener 1883
protocol mqtt

# --------------------------------------------------------------- accès
# `false` est le réglage qui sépare un broker privé d'un broker public.
# Ne jamais le passer à `true` sur un flux contenant des positions réelles.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --------------------------------------------------------------- durée de vie
# TTL. Sur de la télémétrie, une trame non délivrée depuis quelques minutes
# n'a plus de valeur : la position est périmée. Mieux vaut la perdre que la
# rejouer et fausser un trajet.
#
# Le TTL par message (Message Expiry Interval) est une propriété MQTT 5 posée
# par le PUBLIEUR — côté Flespi, ou par nos tests. Le broker, lui, contrôle
# l'expiration des sessions et la taille des files.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# TTL de session : purge des sessions persistantes abandonnées.
persistent_client_expiration 1h

# Plafond de file par client déconnecté : au-delà, on jette les plus anciens.
max_queued_messages 2000
queue_qos0_messages false

# Taille maximale d'une trame Flespi normalisée.
max_packet_size 262144
max_keepalive 120

# --------------------------------------------------------------- journalisation
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
connection_messages true

# =============================================================================
#  TLS — à activer avant toute exposition hors du réseau Docker
# =============================================================================
# listener 8883
# protocol mqtt
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# tls_version tlsv1.2
# require_certificate false